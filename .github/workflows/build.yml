name: Build Cheat Engine

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: ['x86_64', 'i386']
    name: Build Windows (${ { matrix.arch } })
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Cache Lazarus
        uses: actions/cache@v3
        with:
          path: C:\lazarus
          key: lazarus-2.2.2-${{ runner.os }}
          restore-keys: |
            lazarus-2.2.2-

      - name: Download Lazarus 2.2.2
        shell: powershell
        run: |
          $url = "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%202.2.2/lazarus-2.2.2-fpc-3.2.2-win64.exe/download"
          $output = "C:\lazarus-installer.exe"
          if (-not (Test-Path "C:\lazarus\bin\lazbuild.exe")) {
            Write-Host "Downloading Lazarus..."
            # Note: Direct download may fail due to SourceForge redirects
            # Consider using a mirror or pre-caching
            # Attempt to download installer (may redirect to mirror)
            try {
              Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 120
              Write-Host "Downloaded installer to $output"
            } catch {
              Write-Host "Download attempt failed. You can pre-cache Lazarus in the cache or install it on the runner."
            }
            Write-Host "Please ensure Lazarus 2.2.2 is installed at C:\lazarus or available in the cache"
          }

      - name: Setup Lazarus (Alternative)
        shell: powershell
        run: |
          if (-not (Test-Path "C:\lazarus\bin\lazbuild.exe")) {
            Write-Host "Lazarus not found on runner. The workflow will skip Lazarus-based build steps instead of failing."
            # Do NOT exit with error here; later build steps check for lazbuild and will be skipped if missing
          } else {
            Write-Host "Lazarus found at C:\lazarus"
          }

      - name: Add Lazarus to PATH
        shell: powershell
        run: |
          if (Test-Path "C:\lazarus\bin") {
            Add-Content $env:GITHUB_PATH "C:\lazarus\bin"
          } elseif (Test-Path "C:\Program Files\Lazarus\2.2\bin") {
            Add-Content $env:GITHUB_PATH "C:\Program Files\Lazarus\2.2\bin"
          } else {
            Write-Host "Lazarus bin directory not found; PATH not modified. Build steps will check for lazbuild before running."
          }

      - name: Build Cheat Engine (64-bit)
        if: matrix.arch == 'x86_64'
        shell: powershell
        working-directory: .\Cheat Engine
        run: |
          if (-not (Test-Path "C:\lazarus\bin\lazbuild.exe")) {
            Write-Host "lazbuild not found, skipping 64-bit build"
            exit 0
          }
          & "C:\lazarus\bin\lazbuild.exe" -B cheatengine.lpi

      - name: Build Cheat Engine (32-bit)
        if: matrix.arch == 'i386'
        shell: powershell
        working-directory: .\Cheat Engine
        run: |
          if (-not (Test-Path "C:\lazarus\bin\lazbuild.exe")) {
            Write-Host "lazbuild not found, skipping 32-bit build"
            exit 0
          }
          & "C:\lazarus\bin\lazbuild.exe" -B --cpu=i386 cheatengine.lpi

      - name: Build speedhack DLL (64-bit)
        shell: powershell
        working-directory: .\Cheat Engine\speedhack
        run: |
          if (-not (Test-Path "C:\lazarus\bin\lazbuild.exe")) {
            Write-Host "lazbuild not found, skipping speedhack build"
            exit 0
          }
          & "C:\lazarus\bin\lazbuild.exe" -B speedhack.lpr

      - name: Build luaclient DLL (64-bit)
        shell: powershell
        working-directory: .\Cheat Engine\luaclient
        run: |
          if (-not (Test-Path "C:\lazarus\bin\lazbuild.exe")) {
            Write-Host "lazbuild not found, skipping luaclient build"
            exit 0
          }
          & "C:\lazarus\bin\lazbuild.exe" -B luaclient.lpr

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheat-engine-windows-${{ matrix.arch }}
          path: |
            Cheat Engine/bin/
            Cheat Engine/speedhack/bin/
            Cheat Engine/luaclient/bin/
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux (ceserver)
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make

      - name: Build ceserver
        working-directory: Cheat Engine/ceserver/gcc
        run: |
          make clean
          make

      - name: Upload ceserver artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ceserver-linux
          path: Cheat Engine/ceserver/gcc/bin/
          retention-days: 30

  create-installer:
    runs-on: windows-latest
    needs: build-windows
    name: Create Installer
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup NSIS
        run: |
          choco install nsis -y

      - name: Create installer script
        shell: powershell
        run: |
          $nisScript = @"
          ; Cheat Engine Installer Script
          !include "MUI2.nsh"
          
          Name "Cheat Engine"
          OutFile "CheatEngine-Installer.exe"
          InstallDir "`$PROGRAMFILES\Cheat Engine"
          
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          
          !insertmacro MUI_LANGUAGE "English"
          
          Section "Install"
            SetOutPath "`$INSTDIR"
            File /r "artifacts\cheat-engine-windows-x86_64\*.*"
            CreateDirectory "`$SMPROGRAMS\Cheat Engine"
            CreateShortCut "`$SMPROGRAMS\Cheat Engine\Cheat Engine.lnk" "`$INSTDIR\cheatengine.exe"
            CreateShortCut "`$DESKTOP\Cheat Engine.lnk" "`$INSTDIR\cheatengine.exe"
          SectionEnd
          
          Section "Uninstall"
            RMDir /r "`$INSTDIR"
            RMDir /r "`$SMPROGRAMS\Cheat Engine"
            Delete "`$DESKTOP\Cheat Engine.lnk"
          SectionEnd
          "@
          
          Set-Content -Path "CheatEngine.nsi" -Value $nisScript

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" CheatEngine.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheat-engine-installer
          path: CheatEngine-Installer.exe
          retention-days: 90

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, create-installer]
    if: startsWith(github.ref, 'refs/tags/')
    name: Create Release
    
    steps:
      - uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/cheat-engine-installer/*.exe
            release-artifacts/cheat-engine-windows-x86_64/**/*
            release-artifacts/cheat-engine-windows-i386/**/*
            release-artifacts/ceserver-linux/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
